name: NexusQA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff mypy pydantic
      - name: Ruff check
        run: ruff check .
      - name: Mypy check
        run: mypy .

  functional-and-security-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: playwright install ${{ matrix.browser }} --with-deps

      - name: Start Docker Compose stack
        run: docker compose up --build -d
        env:
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}

      - name: Wait for backend to be reachable
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/orders/1 && break
            echo "Waiting for backend..." && sleep 2
          done

      - name: Run functional and security tests
        env:
          NEXUSQA_BACKEND_URL: http://localhost:8000
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}
        run: pytest tests/functional/ tests/security/ -v --browser ${{ matrix.browser }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}
          path: reports/

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down

      - name: Generate coverage badge
        if: matrix.browser == 'chromium'
        run: |
          pip install genbadge[coverage]
          genbadge coverage -i reports/coverage.xml -o docs/coverage-badge.svg

      - name: Commit coverage badge
        if: matrix.browser == 'chromium'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/coverage-badge.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push

  chaos-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt

      - name: Start Docker Compose stack
        run: docker compose up --build -d
        env:
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}

      - name: Wait for backend to be reachable
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/orders/1 && break
            sleep 2
          done

      - name: Run chaos tests
        env:
          NEXUSQA_BACKEND_URL: http://localhost:8000
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}
        run: pytest tests/chaos/ -v

      - name: Upload chaos test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-chaos
          path: reports/

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down 

  performance-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start Docker Compose stack
        run: docker compose up --build -d
        env:
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}
          NEXUSQA_DISABLE_SIGNATURE_CHECK: "true"

      - name: Wait for backend
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/orders/1 && break
            sleep 2
          done

      - name: Run k6 checkout load test
        run: k6 run --summary-export=reports/k6-checkout-summary.json performance/checkout_load.js

      - name: Run k6 webhook load test
        run: k6 run --summary-export=reports/k6-webhook-summary.json performance/webhook_load.js

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: reports/k6-*.json

      - name: Tear down
        if: always()
        run: docker compose down

  publish-dashboard:
    runs-on: ubuntu-latest
    needs: [functional-and-security-tests, chaos-tests, performance-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build dashboard
        run: |
          mkdir -p public/chromium public/firefox public/webkit public/chaos public/k6
          cp -r artifacts/test-report-chromium/* public/chromium/
          cp -r artifacts/test-report-firefox/* public/firefox/
          cp -r artifacts/test-report-webkit/* public/webkit/
          cp -r artifacts/test-report-chaos/* public/chaos/
          find artifacts/k6-results -name "*.json" -exec cp {} public/k6/ \;

          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>NexusQA test dashboard</title></head>
          <body>
            <h1>NexusQA test dashboard</h1>
            <p>Generated from the latest CI run on main.</p>
            <ul>
              <li><a href="chromium/report.html">Functional and security report (Chromium)</a></li>
              <li><a href="chromium/coverage/index.html">Coverage report</a></li>
              <li><a href="firefox/report.html">Functional and security report (Firefox)</a></li>
              <li><a href="webkit/report.html">Functional and security report (WebKit)</a></li>
              <li><a href="chaos/report.html">Chaos test report</a></li>
              <li><a href="k6/k6-checkout-summary.json">k6 checkout load results</a></li>
              <li><a href="k6/k6-webhook-summary.json">k6 webhook load results</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public