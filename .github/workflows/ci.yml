name: NexusQA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff mypy pydantic
      - name: Ruff check
        run: ruff check .
      - name: Mypy check
        run: mypy .

  functional-and-security-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: playwright install ${{ matrix.browser }} --with-deps

      - name: Start Docker Compose stack
        run: docker compose up --build -d
        env:
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}

      - name: Wait for backend to be reachable
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/orders/1 && break
            echo "Waiting for backend..." && sleep 2
          done

      - name: Run functional and security tests
        env:
          NEXUSQA_BACKEND_URL: http://localhost:8000
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}
        run: pytest tests/functional/ test/security/ -v --browser ${{ matrix.browser }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}
          path: reports/
          
      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down

      - name: Generate coverage badge
        if: matrix.browser == 'chromium'
        run: |
          pip install genbadge[coverage]
          genbadge coverage -i reports/coverage.xml -o docs/coverage-badge.svg

      - name: Commit coverage badge
        if: matrix.browser == 'chromium'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/coverage-badge.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push

  chaos-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt

      - name: Start Docker Compose stack
        run: docker compose up --build -d
        env:
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}

      - name: Wait for backend to be reachable
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/orders/1 && break
            echo "Waiting for backend..." && sleep 2
          done

      - name: Run chaos tests
        env:
          NEXUSQA_BACKEND_URL: http://localhost:8000
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}
        run: pytest tests/chaos/ -v

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down

  performance-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    continue-on-error: true  # informational only — doesn't block the pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start Docker Compose stack
        run: docker compose up --build -d
        env:
          NEXUSQA_WEBHOOK_SECRET: ${{ secrets.NEXUSQA_WEBHOOK_SECRET }}
          NEXUSQA_DISABLE_SIGNATURE_CHECK: "true"

      - name: Wait for backend
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/orders/1 && break
            sleep 2
          done

      - name: Run k6 checkout load test
        run: k6 run performance/checkout_load.js

      - name: Run k6 webhook load test
        run: k6 run performance/webhook_load.js

      - name: Tear down
        if: always()
        run: docker compose down