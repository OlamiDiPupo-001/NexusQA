[pytest]

asyncio_mode = auto

addopts = -vv --html=reports/report.html --self-contained-html --cov=backend --cov=framework --cov=webhook_simulator --cov-report=html:reports/coverage --cov-report=xml:reports/coverage.xml --cov-report=term-missing
markers =
    flaky: marks a test as known-flaky, under active investigation (not silently ignored)